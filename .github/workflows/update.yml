name: Prepare Toei timetable
on:
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: 'Skip the 90% gate (stops / trips / stop_times / options) for this run only, after checking the official feed by hand'
        type: boolean
        default: false
  schedule:
    # 21:20 UTC = 06:20 JST. Not on the hour: GitHub may delay or drop jobs queued at the top of an hour.
    - cron: '20 21 * * *'
permissions:
  contents: write
concurrency:
  group: timetable-release
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      # Generated bytecode must not dirty the checkout before recording verified.json.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout public preparation scripts
        run: gh repo clone "$GITHUB_REPOSITORY" source
      - name: Test converter and prepare candidate
        working-directory: source
        run: |
          python3 scripts/test_import_gtfs.py
          python3 scripts/test_publish_release.py
          python3 scripts/test_prepare_release.py
          python3 scripts/test_check_freshness.py
          python3 scripts/prepare_release.py --output "$RUNNER_TEMP/timetable"
      - name: Publish a new version only if the timetable content changed (a leftover draft of the same tag is deleted first)
        working-directory: source
        run: |
          python3 scripts/publish_release.py "$RUNNER_TEMP/timetable/assets" --repository "$GITHUB_REPOSITORY" --verified-out verified.json ${{ inputs.allow_shrink && '--allow-shrink' || '' }}
      - name: Record today's verification (one small commit a day)
        working-directory: source
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verified.json
          git diff --cached --quiet || git commit -m "Verified $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
